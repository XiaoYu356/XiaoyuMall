  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - PRODUCT_SERVICE_URL=http://product-service:8081
  #     - COUPON_SERVICE_URL=http://coupon-service:8082
  #     - USER_SERVICE_URL=http://user-service:8083
  #     - ORDER_SERVICE_URL=http://order-service:8084
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
