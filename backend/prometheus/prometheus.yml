# Prometheus 抓取配置
# ai-service 跑在宿主机（非 Docker 容器），Windows Docker Desktop 用
# host.docker.internal 访问宿主机服务，macOS/Linux 同理
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ai-service
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: ai-service
          env: local
    metrics_path: /metrics

  # Prometheus 自身监控
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
