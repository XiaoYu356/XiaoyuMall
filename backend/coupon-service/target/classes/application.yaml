server:
  port: 8083
  tomcat:
    threads:
      max: 500
      min-spare: 50
    max-connections: 10000
    accept-count: 1000
    connection-timeout: 10000ms

spring:
  application:
    name: coupon-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall_coupon?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 100
      max-wait: 60000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10
          max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.coupon.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  charset:
    console: UTF-8
    file: UTF-8

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

rocketmq:
  enabled: true
  name-server: localhost:9876
  producer:
    group: coupon-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# 优惠券秒杀演进版本开关: v0先查再减(基线,存在并发缺陷) / v1数据库原子扣减 / v2同步Lua预扣 / v3异步MQ削峰
coupon:
  receive:
    version: v1

knife4j:
  enable: true

# 内部服务间共享密钥（Feign/AI 服务调用经 X-Internal-Secret 头携带）
internal:
  secret: xiaoyu-internal-2026
