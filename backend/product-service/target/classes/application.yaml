server:
  port: 8082

spring:
  application:
    name: product-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        enabled: false
    openfeign:
      client:
        config:
          ai-service:
            connect-timeout: 5000
            read-timeout: 120000
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall_product?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 100
      max-wait: 60000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10
          max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.product.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  configuration-properties:
    pagination: true

minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: admin123456
  bucket-name: mall-products
  secure: false

elasticsearch:
  host: localhost
  port: 9201
  username: 
  password: 

logging:
  level:
    com.mall.product: debug
  charset:
    console: UTF-8
    file: UTF-8

ai:
  service:
    url: http://localhost:8000

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

knife4j:
  enable: true
  setting:
    language: zh_cn

rocketmq:
  enabled: true
  name-server: localhost:9876
  producer:
    group: product-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# 内部服务间共享密钥（Feign/AI 服务调用经 X-Internal-Secret 头携带）
internal:
  secret: xiaoyu-internal-2026
